apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rjdevops2025/project-k8s-gitops.git
    targetRevision: qa
    path: manifests/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
