apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: docker.io/rjdevops2025/myapp:391860defb44d1ae1a708360e2de4d3cba0f46e4
        ports:
        - containerPort: 80
