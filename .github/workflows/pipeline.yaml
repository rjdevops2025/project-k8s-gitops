name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, staging, main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}

    - name: Update Kubernetes Manifest
      run: |
        sed -i "s|image: .*|image: docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}|" manifests/${{ github.ref_name }}/deployment.yaml
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"
        git commit -am "Update image tag"
        git push

