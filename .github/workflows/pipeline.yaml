name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - staging
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: docker build -t mydockerhub/myapp:${{ github.sha }} .

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker Image
      run: docker push mydockerhub/myapp:${{ github.sha }}

    - name: SonarQube Scan
      uses: sonarsource/sonarcloud-github-action@master
      with:
        args: >
          -Dsonar.projectKey=myapp
          -Dsonar.organization=myorg
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    - name: Trivy Scan
      run: trivy image mydockerhub/myapp:${{ github.sha }}

    - name: Update Kubernetes Manifests
      run: |
        sed -i "s|mydockerhub/myapp:.*|mydockerhub/myapp:${{ github.sha }}|g" manifests/${{ github.ref_name }}/deployment.yaml
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"
        git commit -am "Update image tag"
        git push

    - name: Slack Notification
      uses: slackapi/slack-github-action@v1.23.0
      with:
        payload: '{"text":"Pipeline completed for branch ${{ github.ref_name }}"}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
