name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, staging, main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: SonarQube Scan
      uses: sonarsource/sonarcloud-github-action@master
      with:
        projectKey: rjdevops2025_project-k8s-gitops
        token: ${{ secrets.SONAR_TOKEN }}

    - name: Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}

    - name: Build Docker Image
      run: docker build -t docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }} .

    - name: Push Docker Image
      run: |
        echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
        docker push docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}

    - name: Update Kubernetes Manifest
      run: |
        sed -i "s|image: .*|image: docker.io/${{ secrets.DOCKER_USERNAME }}/demo-app:${{ github.sha }}|" manifests/${{ github.ref_name }}/deployment.yaml
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git commit -am "Update image tag"
        git push

  deploy-qa:
    runs-on: ubuntu-latest
    needs: build-deploy
    environment:
      name: qa
    steps:
      - name: Deploy to QA
        run: echo "Deploying to QA..."

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: staging
    steps:
      - name: Deploy to Staging
        run: echo "Deploying to Staging..."

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: prod
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Production..."

