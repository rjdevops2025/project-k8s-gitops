name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - staging
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: docker build -t docker.io/rjdevops2025/myapp:${{ github.sha }} .

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push Docker Image
      run: docker push docker.io/rjdevops2025/myapp:${{ github.sha }}

    - name: SonarQube Scan
      uses: sonarsource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=rjdevops2025_project-k8s-gitops
          -Dsonar.organization=rjdevops2025
          -Dsonar.host.url=https://sonarcloud.io

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install -y trivy

    - name: Trivy Scan
      run: trivy image docker.io/rjdevops2025/myapp:${{ github.sha }}


    - name: Update Kubernetes Manifests
      run: |
        sed -i "s|docker.io/.*/myapp:.*|docker.io/${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}|g" manifests/${{ github.ref_name }}/deployment.yaml
        git config --global user.email "ci@github.com"
        git config --global user.name "GitHub Actions"
        git commit -am "Update image tag"
        git push

    - name: Slack Notification
      uses: slackapi/slack-github-action@v1.23.0
      with:
        payload: '{"text":"Pipeline completed for branch ${{ github.ref_name }}"}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
